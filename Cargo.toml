[package]
name = "mtui"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3"
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[profile.release]
strip = true
lto = true
